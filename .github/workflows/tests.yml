# Runs the checks and the test suite on a fresh machine for every pull request
# and every push to master. Branch protection on master requires this to pass.
name: tests

on:
  pull_request:
  push:
    branches: [master]

# The workflow only reads the repository.
permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Third-party actions are pinned to a commit, not a tag, so that a moved
      # tag cannot change what runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ffmpeg and gettext
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg gettext

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # The test settings supply throwaway keys, so no .env or secrets are needed.
      - name: Compile translations
        run: python manage.py compilemessages
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings

      - name: System checks
        run: python manage.py check
        env:
          DJANGO_SETTINGS_MODULE: config.test_settings

      - name: Tests
        run: pytest
